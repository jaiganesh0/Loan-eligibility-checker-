<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan Eligibility Predictor</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Loan eligibility predictor</h1><p class="sub">Enter your details to check if a loan is likely to be approved and see your EMI.</p>
<form id="f" class="form" novalidate>
<label>Monthly income (Rs.)<input id="income" type="number" min="0" required></label>
<label>Existing monthly EMIs (Rs.)<input id="emi" type="number" min="0" value="0" required></label>
<label>Loan amount (Rs.)<input id="amount" type="number" min="1000" required></label>
<label>Tenure (years)<input id="years" type="number" min="1" max="30" value="5" required></label>
<label>Interest rate (% per year)<input id="rate" type="number" min="1" max="40" step="0.1" value="10" required></label>
<label>Credit score (300-900)<input id="score" type="number" min="300" max="900" required></label>
<label>Employment<select id="job"><option>Salaried</option><option>Self-employed</option></select></label>
<button id="calc" type="submit">Check eligibility</button><p id="err" role="alert"></p></form>
<section id="res" class="res" hidden aria-live="polite"></section>
<p class="note">This is a simple educational calculator using common rules (EMI burden up to 50% of income, credit score 650+). It is not a real bank decision.</p></main>
<script src="script.js"></script></body></html>
